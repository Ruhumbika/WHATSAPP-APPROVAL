name: Gateway contract tests

on:
  push:
    branches:
      - feature/universal-erp-integration-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q approval_gateway tests
      - name: Run isolated unit and contract tests
        run: python -m unittest discover -s tests -q
